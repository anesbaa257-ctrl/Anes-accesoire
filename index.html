<!DOCTYPE html>
<html lang="fr" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKMEI Homme - Vente Acier Inoxydable</title>
  <meta name="description" content="Vente SKMEI Homme en acier inoxydable. Dateur, aiguilles lumineuses, style premium.">
  <style>
    :root{--bg:#080808;--card:#111;--gold:#d8b15a;--text:#fff;--muted:#bdbdbd;--green:#18bb6a;}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#050505,#111);color:var(--text);font-family:Arial,sans-serif;direction:rtl;text-align:right}
    .container{max-width:1000px;margin:auto;padding:0 15px}
    .hero{padding:20px 0 14px;text-align:center;background:radial-gradient(circle at 50% 10%,#252525 0,#090909 55%)}
    .badge{display:inline-block;border:1px solid #333;border-radius:999px;padding:7px 13px;color:#eee;font-size:13px;margin-bottom:10px}
    h1{font-size:clamp(30px,5vw,50px);margin:10px 0 0;letter-spacing:-1px}
    .hero p{color:#ddd;max-width:680px;margin:0 auto 18px}
    .hero-img{width:100%;max-width:600px;border-radius:24px;display:block;margin:18px auto;box-shadow:0 14px 55px #000}
    .price{font-size:36px;font-weight:900;color:var(--gold);margin:10px 0}
    .old{color:#777;text-decoration:line-through;font-size:18px}
    .cta{display:inline-block;background:var(--green);color:white;text-decoration:none;font-weight:900;padding:15px 28px;border-radius:14px;font-size:18px;margin-top:10px}
    .trust{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
    .trust span{background:#101010;border:1px solid #2b2b2b;border-radius:12px;padding:8px 11px;color:#eee;font-size:12px}
    section{padding:40px 0}
    .title{text-align:center;font-size:30px;margin:0 0 22px}
    .sub{text-align:center;color:var(--muted);margin:-12px auto 24px;max-width:700px}
    .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .gallery img{width:100%;border-radius:18px;display:block;background:#1a1a1a;box-shadow:0 8px 30px #000}
    .features{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .feature{background:linear-gradient(145deg,#151515,#0d0d0d);border:1px solid #2b2b2b;border-radius:16px;padding:18px;text-align:center}
    .order{background:linear-gradient(145deg,#181818,#0b0b0b);border:1px solid #333;border-radius:22px;padding:22px;max-width:600px;margin:auto}
    label{display:block;margin:12px 0 6px;font-weight:700}
    input,select{width:100%;padding:14px;border-radius:11px;border:1px solid #444;background:#080808;color:#fff;font-size:16px}
    .row{display:flex;justify-content:space-between;gap:15px;margin:15px 0;color:#ddd}
    .row strong{color:#fff} .total-final{font-size:22px;font-weight:900;color:var(--gold);border-top:1px solid #333;padding-top:12px}
    .submit{width:100%;border:0;background:var(--green);color:#fff;font-size:19px;font-weight:900;padding:16px;border-radius:14px;cursor:pointer;margin-top:15px}
    .success{display:none;margin-top:20px;padding:20px;background:#052217;border:1px solid #18bb6a;border-radius:14px;text-align:center;color:#fff}
    footer{padding:30px 0;text-align:center;color:#888;font-size:11px}
    @media(max-width:729px){.features{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:480px){.gallery{grid-template-columns:1fr}.features{grid-template-columns:1fr}}
  </style>
</head>
<body>

  <section class="hero">
    <div class="container">
      <span class="badge">ساعة رجالية فخمة</span>
      <h1>SKMEI مقاومة للماء والصدأ</h1>
      <p>تصميم أنيق ومتين يناسب جميع الإطلالات</p>
      <div class="price">2,900 د.ج <span class="old">4,500 د.ج</span></div>
      <a class="cta" href="#order">اطلب الآن - التوصيل سريع</a>
    </div>
  </section>

  <section id="order">
    <div class="container">
      <h2 class="title">استمارة الطلب</h2>
      <div class="order">
        <form id="orderForm">
          <label>الاسم الكامل *</label>
          <input type="text" id="fullName" required placeholder="أدخل اسمك">

          <label>رقم الهاتف *</label>
          <input type="tel" id="phone" required placeholder="06XXXXXXXX">

          <label>الولاية *</label>
          <select id="wilaya" required>
            <option value="">اختر الولاية</option>
            <option value="16">16 - الجزائر</option>
            <option value="31">31 - وهران</option>
            <option value="25">25 - قسنطينة</option>
            <option value="19">19 - سطيف</option>
            <option value="09">09 - البليدة</option>
          </select>

          <label>البلدية *</label>
          <input type="text" id="commune" required placeholder="أدخل اسم البلدية">

          <label>العنوان</label>
          <input type="text" id="address" placeholder="الحي / الشارع">

          <label>نوع التوصيل *</label>
          <select id="deliveryType">
            <option value="home">توصيل للمنزل</option>
            <option value="desk">استلام من المكتب</option>
          </select>

          <label>الكمية *</label>
          <input type="number" id="quantite" value="1" min="1" required>

          <button type="submit" class="submit" id="submitBtn">تأكيد الطلب الآن</button>
        </form>

        <div id="successMsg" class="success">
          ✅ تم تسجيل طلبك بنجاح! سنتصل بك قريباً لتأكيد التوصيل.
        </div>
      </div>
    </div>
  </section>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxKARn5PTnB2zFavqOARQDIU90ZNTAHW6_wNc15SStIUJa2E4m-WHGLHaqYYDnhBCcMqA/exec';

    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري إرسال الطلب...';

      const formData = new FormData();
      formData.append('fullName', document.getElementById('fullName').value);
      formData.append('phone', document.getElementById('phone').value);
      formData.append('wilaya', document.getElementById('wilaya').options[document.getElementById('wilaya').selectedIndex].text);
      formData.append('commune', document.getElementById('commune').value);
      formData.append('address', document.getElementById('address').value);
      formData.append('deliveryType', document.getElementById('deliveryType').value === 'home' ? 'للمنزل' : 'للمكتب');
      formData.append('quantite', document.getElementById('quantite').value);

      fetch(SCRIPT_URL, { method: 'POST', body: formData })
      .then(response => response.json())
      .then(data => {
        document.getElementById('orderForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      })
      .catch(error => {
        alert('تم إرسال طلبك بنجاح!');
        document.getElementById('orderForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      });
    });
  </script>
</body>
</html>
