<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساعة Skmei - طلب سريع</title>
    
    <!-- 1️⃣ كود الـ CSS (التصميم والألوان) -->
    <style>
        body {
            background-color: #0b0d0f;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #161a1d;
            padding: 20px;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #262b30;
        }
        .price { font-size: 20px; color: #10b981; font-weight: bold; margin: 10px 0; }
        select, input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #0b0d0f;
            color: white;
            border: 1px solid #2d3339;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #10b981;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 2️⃣ كود الـ HTML (الهيكل والعناصر) -->
    <div class="card">
        <h2>ساعة Skmei الفاخرة</h2>
        <p>سعر الساعة: <b>2,900 DA</b></p>
        
        <label>اختر الولاية:</label>
        <select id="wilaya" onchange="updateTotal()">
            <option value="0">اختر الولاية...</option>
            <option value="400">16 - الجزائر (توصيل: 400 DA)</option>
            <option value="600">31 - وهران (توصيل: 600 DA)</option>
            <option value="800">23 - عنابة (توصيل: 800 DA)</option>
        </select>

        <div class="price">
            المجموع الكلي: <span id="totalPrice">2,900</span> DA
        </div>

        <button onclick="submitOrder()">تأكيد الطلب</button>
    </div>

    <!-- 3️⃣ كود الـ JavaScript (التفاعل والعمليات) -->
    <script>
        function updateTotal() {
            const productPrice = 2900;
            const deliveryCost = parseInt(document.getElementById('wilaya').value) || 0;
            const total = productPrice + deliveryCost;
            
            // تحديث السعر المباشر في الصفحة
            document.getElementById('totalPrice').innerText = total.toLocaleString();
        }

        function submitOrder() {
            const wilayaSelect = document.getElementById('wilaya');
            if (wilayaSelect.value == "0") {
                alert("يرجى اختيار الولاية أولاً!");
            } else {
                alert("تم تسجيل طلبك بنجاح! المجموع: " + document.getElementById('totalPrice').innerText + " DA");
            }
        }
    </script>

</body>
</html>
